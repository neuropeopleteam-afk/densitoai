# DensitoAI — единый конфиг инференса (читается inference.py, api_server.py, demo).
# Все пороги/веса — ТОЛЬКО здесь. Если поле threshold для критерия == null,
# порог берётся из models/metrics_summary.json (поле "threshold"), а если и там
# нет — из fallback_threshold.

version: "2.5.0"

# Маркировка назначения. Одна строка — один источник: её показывает веб, отдаёт /api/health,
# она же стоит в README, docs/VERIFICATION.md и docs/DZM_CONFORMANCE.md. Не редактировать
# в двух местах: правится здесь.
intended_use:
  disclaimer: >-
    Программа не является медицинским изделием и не предназначена для диагностики,
    профилактики, лечения или мониторинга заболеваний. Сервис оценивает техническое
    качество укладки и области интереса исследования и не формирует медицинское
    заключение. Решение по исследованию принимает врач.
  scope: >-
    Денситометрия (DXA) поясничного отдела позвоночника и проксимального отдела бедра,
    оборудование GE Lunar Prodigy. Вне этой области применения результат не определён.

output:
  # Официальные названия колонок (порядок важен, не менять).
  columns:
    - path_to_study
    - study_uid
    - image_uid
    - anatomical_region
    - quality_class
    - violation_type
    - quality_prob
    - processing_status
    - time_of_processing
  status_success: "Success"
  status_failure: "Failure"
  violation_separator: ";"
  # Вероятность, записываемая в строку-заглушку при сбое обработки файла. Строго < 0.5: у строки Failure
  # quality_class 0, а инвариант выгрузки — «quality_class 1 <=> quality_prob >= 0.5» (CSV/XLSX/API пишут
  # число без округления, 0.499999). Значение >= 0.5 инференс не запишет — будет взято 0.499999.
  fallback_quality_prob: 0.499999
  # Как записывать path_to_study: relative (к входной папке) | absolute | name
  path_mode: relative
  csv_encoding: "utf-8"

regions:
  # Официальные строки anatomical_region (сторона бедра НЕ указывается).
  spine: "Поясничный отдел позвоночника"
  hip: "Проксимальный отдел бедра"
  # Регион по умолчанию, если не удалось определить (в исследовании обычно
  # 1 снимок позвоночника и 2 бедра -> априорно бедро вероятнее).
  default_when_unknown: hip
  # Правило по ширине изображения (подтверждено организаторами на Q&A):
  # ширина >= 290 px -> позвоночник (300 px), иначе бедро (280/248 px).
  spine_min_cols: 290
  # Стандартные ширины снимков прибора (GE Lunar Prodigy). При другой ширине
  # область определяется резервным классификатором по содержимому
  # (models/model_region_emb.pkl), а не правилом по ширине.
  standard_cols: [300, 280, 248]

violations:
  # Закрытый список официальных строк. Не переводить, не парафразировать.
  sp_pos: "Некорректная укладка"
  sp_axis: "Не выравнена ось позвоночника"
  sp_art: "Присутствуют посторонние предметы"
  rh_pos: "Некорректная укладка"
  rh_roi: "Некорректная область интереса"
  lh_pos: "Некорректная укладка"
  lh_roi: "Некорректная область интереса"

criteria_by_region:
  spine: [sp_pos, sp_axis, sp_art]
  right_hip: [rh_pos, rh_roi]
  left_hip: [lh_pos, lh_roi]

# Признаки контура A для каждого критерия. Истина для боя — feature_cols внутри models/model_*_geom.pkl
# (инференс берёт их оттуда); этот список обязан с ними совпадать и с CRITERION_GEOMETRY_COLS в
# train_stacked.py (бедро: rh_/lh_pos = hip_pos, rh_/lh_roi = hip_roi). Сверка — tests/test_feature_contract.py.
geometry_cols:
  sp_pos: [center_offset_ratio, bone_width_ratio]
  sp_axis: [axis_angle_deg]
  # sp_art (2.5.0): площадь и перепад плотных участков в зоне измерения — верхние 70 % протяжённости кости.
  # Включено решением владельца, как голова укладки H2 в 2.4.0: правило проекта (ΔAUC >= 0.03 в >= 70 % повторов
  # без потери macro-F1) пройдено 19/20 (фиксированная отсечка 70 % — 20/20), Δmacro-F1 +0.074; калиброванный гейт
  # tools/paired_gate.py НЕ пройден (ДИ95 [-0.029; +0.176], p 0.072, sign-flip 0.092) при 17 положительных
  # исследованиях; на 40 кадрах врачей эффекта нет. models/nested_gate_decisions.json, docs/NESTED_GATE_REPORT.md, часть 7.
  sp_art: [metal_metal_band70_area_log, metal_metal_band70_max_gap]   # 2.5.0: верхние 70 % протяжённости кости
  rh_pos: [femur_solidity, shaft_width_mm, abs_shaft_angle_deg, merge_height_mm, medial_neck_extent_mm]
  rh_roi: [scan_length_mm, shaft_len_below_troch_mm]
  lh_pos: [femur_solidity, shaft_width_mm, abs_shaft_angle_deg, merge_height_mm, medial_neck_extent_mm]
  lh_roi: [scan_length_mm, shaft_len_below_troch_mm]

# H2 (2.4.0): признаки контура A, считаемые не из геометрии, а из канонического эмбеддинга кадра
# (только позвоночник). sp_pos: synth_pos_logit — логит головы «дефект укладки»
# models/head_densito_synth.pth (src/sppos_head.py), обученной на синтетических смещениях кадра без меток;
# вход головы — эмбеддинг densito канонического кадра, который контур B sp_pos уже считает.
# Признак входит третьим в геометрическую модель model_spine_sp_pos_geom.pkl (вместе с geometry_cols.sp_pos);
# в any-модель региона не входит. Список ОБЯЗАН совпадать с CRITERION_EXTRA_COLS в train_stacked.py.
# Принят по действующему правилу nested (ΔAUC >= 0.03 в 20/20 повторов); калиброванный гейт при
# 6 положительных исследованиях не имеет мощности (ДИ90 [-0.004; +0.218]) — docs/NESTED_GATE_REPORT.md, часть 5.
# Отсутствие файла головы — явная ошибка при старте, а не молчаливый ноль.
features:
  sp_pos: [synth_pos_logit]

stacking:
  # Ранговое усреднение: скор -> перцентиль относительно OOF-распределения
  # (models/oof_stacked_<region>_<crit>.csv, колонки oof_geom / oof_emb),
  # затем взвешенная сумма. Веса должны совпадать с обучением.
  weight_geom: 0.5
  weight_emb: 0.5
  # Вентиль К2: вес контура A (геометрия) ПО КРИТЕРИЮ, score = w*rank_geom + (1-w)*rank_emb.
  # Ключи: sp_pos, sp_axis, sp_art, hip_pos, hip_roi (rh_*/lh_* берут вес hip_pos/hip_roi).
  # Критерий без записи (или null) использует weight_geom/weight_emb выше. Значение здесь
  # ОБЯЗАНО совпадать с тем, что применялось в train_stacked.py (порог подобран на том же стэке).
  # Выбор веса — только nested repeated GroupKFold (tools/nested_gate.py, отчёт docs/NESTED_GATE_REPORT.md).
  # Итог nested 19.09.2026: ни один критерий не прошёл приёмку полностью
  # (sp_axis: +0.069 AUC, 8/10 повторов >= 0.03, но macro-F1 -0.005 -> формально не принят);
  # поэтому таблица пуста, поведение = 0.5/0.5. Включение sp_axis: 1.0 — решение оркестратора,
  # после него обязателен перезапуск train_stacked.py и train_final_models.py.
  weights_by_criterion: {}
  # Как агрегировать скоры критериев в quality_prob (бинарное "есть нарушение"):
  # max | noisy_or. Если есть отдельная модель model_<region>_any_*.pkl — она приоритетнее.
  any_violation_aggregation: max
  # quality_prob = w * any-модель + (1-w) * агрегат по критериям (OOF: смесь лучше каждого по отдельности)
  any_blend_weight_model: 0.5
  # Согласовать quality_prob с quality_class: class=1 -> prob в [0.5,1], class=0 -> prob в [0,0.5).
  # Монотонно внутри класса. OOF ROC-AUC смеси до/после согласования (models/metrics_oof_full.json,
  # by_region_binary.*.roc_auc_components, файл от 23.09.2026): spine 0.823 -> 0.813, hip 0.759 -> 0.760.
  consistent_quality_prob: true

thresholds:
  # null -> взять из metrics_summary.json
  sp_pos: null
  sp_axis: null
  sp_art: null
  rh_pos: null
  rh_roi: null
  lh_pos: null
  lh_roi: null
fallback_threshold: 0.5

# Физические правила контура A (используются, когда .pkl моделей ещё нет
# или они не загрузились). Вероятность = sigmoid((x - center) / scale).
fallback_rules:
  # Центры откалиброваны на data/geometry_features.csv: квантиль (1 - доля позитивов)
  # признака по обучающей выборке (prevalence-порог, без подгонки на редких метках);
  # для ROI бедра — физический порог ТЗ (>= 2 см от края кадра).
  # ВНИМАНИЕ: fallback-правила заметно слабее обученных моделей (см. README, раздел
  # «Ограничения»), они нужны только чтобы инференс давал осмысленный ответ без .pkl.
  sp_axis:   {feature: axis_angle_deg,              center: 3.6,   scale: 1.0,   direction: 1}   # ТЗ: до 5°, измеренный угол систематически ниже экспертного
  sp_art:    {feature: metal_metal_area_mm2,        center: 670.0, scale: 200.0, direction: 1}
  sp_pos:    {feature: center_offset_ratio_abs,     center: 0.074, scale: 0.02,  direction: 1}
  rh_pos:    {feature: shaft_angle_deg,             center: 16.3,  scale: 3.0,   direction: 1}
  lh_pos:    {feature: shaft_angle_deg,             center: 14.7,  scale: 3.0,   direction: 1}
  rh_roi:    {feature: edge_distance_mm,            center: 20.0,  scale: 3.0,   direction: -1}  # ТЗ: >= 2 см от края
  lh_roi:    {feature: edge_distance_mm,            center: 20.0,  scale: 3.0,   direction: -1}
  # Порог принятия решения для fallback-правил (в шкале вероятности)
  decision_threshold: 0.5

validation:
  min_rows: 64
  max_rows: 4096
  min_cols: 64
  max_cols: 4096
  # Доля пикселей кости (после сегментации) в нормальном диапазоне — иначе
  # изображение считается "нестандартным" (пишем предупреждение в лог,
  # результат остаётся консервативным).
  min_bone_fraction: 0.01
  max_bone_fraction: 0.90

# Предобработка по критерию (К11). Варианты — src/preprocess.py: VARIANTS:
#   baseline  — как в 2.1.0 (маска тела жёстким порогом по сырому кадру, без канонизации);
#   mask      — маска тела по сглаженному кадру (только устойчивость к шуму);
#   canonical — mask + канонизация экспозиции по models/exposure_reference.json.
#
# Почему не один вариант на всё: для УКЛАДКИ экспозиция — шум (канонизация помогает),
# а для ПОСТОРОННИХ ПРЕДМЕТОВ и ROI абсолютная плотность — сигнал, и канонизация его стирает.
# Выбор сделан ТОЛЬКО nested repeated GroupKFold 5×10 (tools/preproc_gate.py, две стадии: контур A,
# затем контур B), отчёт — docs/PREPROC_GATE_REPORT.md, решения — models/preproc_gate_decisions_{a,b}.json.
# Значения ОБЯЗАНЫ совпадать с применёнными в train_stacked.py (проверка при загрузке моделей:
# metrics_summary.json → <crit>.preproc). После изменения обязательны train_stacked.py и train_final_models.py.
# Откат к поведению 2.1.0: enabled: false (все критерии читают baseline) + перезапуск обучения.
preprocessing:
  enabled: true
  variant_by_criterion:
    sp_pos:  {geom: canonical, emb: canonical}   # A: +0.028 AUC, 44/49 фолдов; B: +0.021, ДИ [0.000; 0.066]
    sp_axis: {geom: baseline,  emb: baseline}    # A: -0.003; B: -0.023 — канонизация не принята
    sp_art:  {geom: baseline,  emb: baseline}    # A: -0.019 (плотность предмета — сигнал); B: -0.030
    hip_pos: {geom: canonical, emb: baseline}    # A: +0.002, 30/50 фолдов за canonical; B: -0.003 — не принят (замер альтернативы — docs/PREPROC_GATE_REPORT.md)
    hip_roi: {geom: baseline,  emb: baseline}    # A: -0.029 (длина скана/диафиза по маске); B: -0.003

# Источник эмбеддингов контура B ПО КРИТЕРИЮ (К13). Значения — src/embeddings.py: BACKBONE_FILES
# плюс `imagenet` (torchvision, без файла весов):
#   imagenet         — EfficientNet-B0 ImageNet1k;
#   densito          — наш B0, предобученный на GPU прокси-задачами укладки (15 633 плитки);
#   densito_inv      — тот же пул, но loss инвариантности эмбеддинга к гамме и шуму (v3_inv);
#   densito_inv_free — то же без данных с несвободной лицензией (v3_nolic; только CC BY 4.0 + AASCE + DEXA + наши).
# Источник истины — этот конфиг: train_stacked.py и train_final_models.py читают его, значение попадает
# в meta .pkl (emb_source) и в metrics_summary.json; расхождение роняет самопроверку (tools/verify_checks.py).
# Выбор сделан ТОЛЬКО nested repeated GroupKFold 5×10 (tools/emb_gate.py), отчёт — docs/EMB_GATE_REPORT.md,
# решения — models/emb_gate_decisions.json. Ключи hip_pos / hip_roi используются для rh_*/lh_*.
# После изменения обязательны train_stacked.py и train_final_models.py, затем hash_weights и verify --update-expected.
embeddings:
  source_by_criterion:
    sp_pos:  densito     # К13: ни один новый бэкбон правило не прошёл (canonical AUC 0.747 против 0.565 у v3)
    sp_axis: densito_inv # ПРИНЯТ nested 5×20: стек ΔAUC +0.111 (≥0.03 в 19/20 повторов, в плюсе 20/20), Δmacro-F1 +0.113, выбран в 69/100 фолдов
    sp_art:  imagenet    # ImageNet на посторонних предметах недостижим (все кандидаты хуже: ΔAUC −0.045…−0.083)
    hip_pos: imagenet    # К13 обещал +0.131 на контуре B, но на полном стеке ΔAUC +0.007 (6/20) — не принят
    hip_roi: imagenet    # v2 формально проходил, но до 79 % переворотов при гамме 0.7; inv/inv_free хуже (−0.064/−0.068)

pixel_spacing_mm:
  # Lunar Prodigy Advance (подтверждено организаторами). Используется, если
  # тег PixelSpacing / ImagerPixelSpacing отсутствует.
  y: 1.05
  x: 0.6

# Тексты для карточки решения и режима лаборанта (только UI; на 9 колонок CSV и на модель не влияют).
# Экспорт в web/assets/actions.json: python tools/web/build_actions_json.py
# Ключи hip_pos / hip_roi используются для rh_*/lh_*. Официальные строки violations выше не дублируются и не меняются.
actions:
  sp_pos:
    reason: "Укладка позвоночника: поле смещено — проверьте, видны ли края подвздошных костей и половина Th12"
    hint: "Уложить пациента по центру стола, позвоночник по средней линии; в кадре должны быть видны края подвздошных костей и половина Th12. Повторить сканирование."
  sp_axis:
    reason: "Ось позвоночника не выровнена по оси стола"
    hint: "Выровнять пациента вдоль продольной оси стола по лазерной метке, без поворота таза и плеч; повторить сканирование."
  sp_art:
    reason: "В поле сканирования — плотный предмет"
    hint: "Если предмет вне зоны измерения L1–L4, на результат он не влияет — решает врач. Если он в зоне измерения — убрать металл и плотные предметы (пуговицы, молнии, ремень, содержимое карманов) и повторить сканирование. Плотный участок кости сервис может принять за предмет."
  hip_pos:
    reason: "Укладка бедра: бедро не развёрнуто внутрь или диафиз наклонён"
    hint: "Развернуть стопу внутрь с фиксатором, диафиз бедра параллельно оси стола; малый вертел должен быть почти не виден; повторить сканирование. Если зона сканирования просто больше обычной, а область интереса снята правильно, это не ошибка укладки — решает врач."
  hip_roi:
    reason: "Область интереса бедра: проверьте, вся ли зона интереса вошла в кадр"
    hint: "Проверить, вошёл ли в кадр проксимальный отдел бедра с участком диафиза ниже вертелов; дальнейшее действие зависит от того, полное ли поле сканирования."
  # C1: развилка по области интереса бедра (код причины extras.hip_roi_reason; класс не меняется)
  hip_roi_field_incomplete:
    reason: "Поле сканирования неполное: скан короткий или диафиза ниже вертела в кадре мало"
    hint: "Обсудить повторное сканирование: в поле должен войти проксимальный отдел бедра с участком диафиза ниже вертелов. Предложение системы, исходное измерение не меняется."
  hip_roi_field_complete:
    reason: "Поле сканирования полное, вопрос к области анализа"
    hint: "Проверить область анализа на аппарате и при необходимости поправить её там; повторно не облучать. Предложение системы, исходное измерение не меняется."
  hip_roi_insufficient_data:
    reason: "Измерений поля недостаточно, чтобы выбрать между повторным сканированием и проверкой анализа"
    hint: "Решение врача по снимку. Предложение системы, исходное измерение не меняется."
  ok:
    reason: "Отклонений от требований не выявлено"
    hint: "Повторное сканирование не требуется."
  fail:
    reason: "Файл не обработан"
    hint: "Проверить, что файл является DICOM-снимком с денситометра, и передать врачу или инженеру."
  review:
    reason: "Оценка на границе допуска"
    hint: "Показать снимок врачу до решения о повторном сканировании."
# Ориентиры и справочные диапазоны для блока «Измерено против нормы».
# guide_* — ориентир из требований и разъяснений; модель решает не по нему (C1: карточка не выдаёт его
# за порог системы). ref_q95 считается скриптом build_actions_json.py по размеченным нормальным кадрам
# data/geometry_features.csv (95 % квантиль модуля признака); ref_range — диапазон 5–95 % — только справочно.
measurement_norms:
  axis_angle_deg:         {label: "Угол оси позвоночника", unit: "°", guide_max: 5.0, ref: true, source: "ориентир требований: отклонение оси не более 5°"}
  center_offset_ratio:    {label: "Смещение центра позвоночника", unit: "% ширины кадра", mult: 100, ref: true}
  metal_metal_area_mm2:   {label: "Площадь плотных объектов", unit: "мм²", ref: true}
  abs_shaft_angle_deg:    {label: "Угол диафиза бедра", unit: "°", ref: true}
  edge_distance_mm:       {label: "Расстояние от кости до края кадра", unit: "мм", guide_min: 20.0, source: "ориентир из разъяснений: не менее 2 см от края"}
  scan_length_mm:         {label: "Длина скана", unit: "мм", ref: true, ref_low: true}
  shaft_len_below_troch_mm: {label: "Диафиз ниже вертелов", unit: "мм", ref: true, ref_low: true}
  lesser_troch_prominence_mm: {label: "Выступ малого вертела", unit: "мм", ref: true}
  # C1: признаки моделей контура A (feature_cols) без собственной нормы — справочный диапазон 5–95 %
  femur_solidity:         {label: "Компактность контура бедра", unit: "", ref: true, ref_range: true}
  shaft_width_mm:         {label: "Ширина диафиза", unit: "мм", ref: true, ref_range: true}
  merge_height_mm:        {label: "Высота слияния диафиза с тазом", unit: "мм", ref: true, ref_range: true}
  medial_neck_extent_mm:  {label: "Медиальный выступ шейки бедра", unit: "мм", ref: true, ref_range: true}
  bone_width_ratio:       {label: "Ширина костной области", unit: "% ширины кадра", mult: 100, ref: true, ref_range: true}
  metal_metal_max_intensity_gap: {label: "Контраст включений к кости", unit: "сигм", ref: true}

# Правило порога по критерию (К3). Значения: f1_optimal (F1-оптимум на OOF при >= 15 позитивах, иначе
# prevalence), prevalence (квантиль 1 - доля позитивов), prevalence_x<k> (квантиль 1 - k*доля позитивов).
# Выбрано ТОЛЬКО nested repeated GroupKFold 5x10 (tools/calibration_eval.py --stage nested,
# outputs: outputs/calibration/nested_thr, отчёт docs/METRICS_REPORT.md «Калибровка и зона не уверен») по минимальному
# среднему regret F1(+) по внешним фолдам. Применяется в train_stacked.py; после изменения обязателен
# перезапуск train_stacked.py (пороги в metrics_summary.json).
thresholds_rule:
  default: f1_optimal
  by_criterion:
    sp_pos: prevalence          # 10 позитивов: f1_optimal и так даёт prevalence
    sp_axis: prevalence_x1.4    # regret 0.038 против 0.090 у f1_optimal
    sp_art: prevalence_x1.4     # regret 0.035 против 0.114
    hip_pos: prevalence         # regret 0.050 против 0.082
    hip_roi: prevalence         # regret 0.026 против 0.049

# Зона «не уверен» (К3): строка/критерий помечается needs_review, если |score - threshold| <= margin.
# Запасы считает train_stacked.py (models/calibration.pkl, metrics_summary.json -> uncertainty) так, чтобы доля
# «не уверен» на OOF была <= max_reject_rate и по критерию, и по строкам региона. Значения ниже — копия
# рассчитанных (источник истины: models/calibration.pkl; при null берутся оттуда). Только debug-CSV и API,
# 9 колонок CSV не меняются.
uncertainty:
  enabled: true
  max_reject_rate: 0.05
  # quota_scope: per_criterion — квота применяется к каждому критерию отдельно (доля строк
  # региона на просмотр выше, потому что строка уходит на просмотр по любому критерию).
  # per_region — прежнее поведение: квота на строки региона; на пяти критериях она давала
  # запас 0.0 четырём критериям, и зона срабатывала только при точном совпадении с порогом.
  quota_scope: per_criterion
  quota_step: 0.0025
  margin_by_criterion:
    # sp_pos (2.4.0, H2): 10 строк OOF стоят ровно на пороге prevalence (ранговые связки), при margin 0.0 доля
    # «не уверен» уже 6.0 % > квоты, поэтому квота даёт 0.0: зона срабатывает только при точном совпадении с порогом.
    sp_pos: 0.0
    sp_axis: 0.004518073
    sp_art: 0.006468646   # 2.5.0: пересчёт квоты после смены признаков контура A
    hip_pos: 0.010638298
    hip_roi: 0.025835867

# Калибровка (К3). Platt по критерию (p_cal = sigmoid(a*score + b)) — только debug-CSV и API details.
# Калибровка any-модели в quality_prob НЕ принята: cross-fit Brier не улучшается значимо
# (docs/METRICS_REPORT.md), поэтому apply_to_quality_prob: false и в коде не реализовано.
calibration:
  criteria_platt: true
  apply_to_quality_prob: false
