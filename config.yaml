# DensitoAI — единый конфиг инференса (читается inference.py, api_server.py, demo).
# Все пороги/веса — ТОЛЬКО здесь. Если поле threshold для критерия == null,
# порог берётся из models/metrics_summary.json (поле "threshold"), а если и там
# нет — из fallback_threshold.

version: "2.1.0"

output:
  # Официальные названия колонок (порядок важен, не менять).
  columns:
    - path_to_study
    - study_uid
    - image_uid
    - anatomical_region
    - quality_class
    - violation_type
    - quality_prob
    - processing_status
    - time_of_processing
  status_success: "Success"
  status_failure: "Failure"
  violation_separator: ";"
  # Вероятность, записываемая в строку-заглушку при сбое обработки файла.
  fallback_quality_prob: 0.5
  # Как записывать path_to_study: relative (к входной папке) | absolute | name
  path_mode: relative
  csv_encoding: "utf-8"

regions:
  # Официальные строки anatomical_region (сторона бедра НЕ указывается).
  spine: "Поясничный отдел позвоночника"
  hip: "Проксимальный отдел бедра"
  # Регион по умолчанию, если не удалось определить (в исследовании обычно
  # 1 снимок позвоночника и 2 бедра -> априорно бедро вероятнее).
  default_when_unknown: hip
  # Правило по ширине изображения (подтверждено организаторами на Q&A):
  # ширина >= 290 px -> позвоночник (300 px), иначе бедро (280/248 px).
  spine_min_cols: 290
  # Стандартные ширины снимков прибора (GE Lunar Prodigy). При другой ширине
  # область определяется резервным классификатором по содержимому
  # (models/model_region_emb.pkl), а не правилом по ширине.
  standard_cols: [300, 280, 248]

violations:
  # Закрытый список официальных строк. Не переводить, не парафразировать.
  sp_pos: "Некорректная укладка"
  sp_axis: "Не выравнена ось позвоночника"
  sp_art: "Присутствуют посторонние предметы"
  rh_pos: "Некорректная укладка"
  rh_roi: "Некорректная область интереса"
  lh_pos: "Некорректная укладка"
  lh_roi: "Некорректная область интереса"

criteria_by_region:
  spine: [sp_pos, sp_axis, sp_art]
  right_hip: [rh_pos, rh_roi]
  left_hip: [lh_pos, lh_roi]

# Признаки контура A для каждого критерия (должны совпадать с train_stacked.py).
geometry_cols:
  sp_pos: [center_offset_ratio, bone_width_ratio]
  sp_axis: [axis_angle_deg]
  sp_art: [metal_metal_area_mm2, metal_metal_max_intensity_gap]
  rh_pos: [shaft_angle_deg]
  rh_roi: [edge_distance_ratio, bone_area_ratio]
  lh_pos: [shaft_angle_deg]
  lh_roi: [edge_distance_ratio, bone_area_ratio]

stacking:
  # Ранговое усреднение: скор -> перцентиль относительно OOF-распределения
  # (models/oof_stacked_<region>_<crit>.csv, колонки oof_geom / oof_emb),
  # затем взвешенная сумма. Веса должны совпадать с обучением.
  weight_geom: 0.5
  weight_emb: 0.5
  # Как агрегировать скоры критериев в quality_prob (бинарное "есть нарушение"):
  # max | noisy_or. Если есть отдельная модель model_<region>_any_*.pkl — она приоритетнее.
  any_violation_aggregation: max
  # quality_prob = w * any-модель + (1-w) * агрегат по критериям (OOF: смесь лучше каждого по отдельности)
  any_blend_weight_model: 0.5
  # Согласовать quality_prob с quality_class: class=1 -> prob в [0.5,1], class=0 -> prob в [0,0.5).
  # Монотонно внутри класса; OOF ROC-AUC spine 0.735->0.771, hip 0.704->0.777.
  consistent_quality_prob: true

thresholds:
  # null -> взять из metrics_summary.json
  sp_pos: null
  sp_axis: null
  sp_art: null
  rh_pos: null
  rh_roi: null
  lh_pos: null
  lh_roi: null
fallback_threshold: 0.5

# Физические правила контура A (используются, когда .pkl моделей ещё нет
# или они не загрузились). Вероятность = sigmoid((x - center) / scale).
fallback_rules:
  # Центры откалиброваны на data/geometry_features.csv: квантиль (1 - доля позитивов)
  # признака по обучающей выборке (prevalence-порог, без подгонки на редких метках);
  # для ROI бедра — физический порог ТЗ (>= 2 см от края кадра).
  # ВНИМАНИЕ: fallback-правила заметно слабее обученных моделей (см. README, раздел
  # «Ограничения»), они нужны только чтобы инференс давал осмысленный ответ без .pkl.
  sp_axis:   {feature: axis_angle_deg,              center: 3.6,   scale: 1.0,   direction: 1}   # ТЗ: до 5°, измеренный угол систематически ниже экспертного
  sp_art:    {feature: metal_metal_area_mm2,        center: 670.0, scale: 200.0, direction: 1}
  sp_pos:    {feature: center_offset_ratio_abs,     center: 0.074, scale: 0.02,  direction: 1}
  rh_pos:    {feature: shaft_angle_deg,             center: 16.3,  scale: 3.0,   direction: 1}
  lh_pos:    {feature: shaft_angle_deg,             center: 14.7,  scale: 3.0,   direction: 1}
  rh_roi:    {feature: edge_distance_mm,            center: 20.0,  scale: 3.0,   direction: -1}  # ТЗ: >= 2 см от края
  lh_roi:    {feature: edge_distance_mm,            center: 20.0,  scale: 3.0,   direction: -1}
  # Порог принятия решения для fallback-правил (в шкале вероятности)
  decision_threshold: 0.5

validation:
  min_rows: 64
  max_rows: 4096
  min_cols: 64
  max_cols: 4096
  # Доля пикселей кости (после сегментации) в нормальном диапазоне — иначе
  # изображение считается "нестандартным" (пишем предупреждение в лог,
  # результат остаётся консервативным).
  min_bone_fraction: 0.01
  max_bone_fraction: 0.90

pixel_spacing_mm:
  # Lunar Prodigy Advance (подтверждено организаторами). Используется, если
  # тег PixelSpacing / ImagerPixelSpacing отсутствует.
  y: 1.05
  x: 0.6
