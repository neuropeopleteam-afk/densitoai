# DensitoAI — единый конфиг инференса (читается inference.py, api_server.py, demo).
# Все пороги/веса — ТОЛЬКО здесь. Если поле threshold для критерия == null,
# порог берётся из models/metrics_summary.json (поле "threshold"), а если и там
# нет — из fallback_threshold.

version: "2.1.0"

output:
  # Официальные названия колонок (порядок важен, не менять).
  columns:
    - path_to_study
    - study_uid
    - image_uid
    - anatomical_region
    - quality_class
    - violation_type
    - quality_prob
    - processing_status
    - time_of_processing
  status_success: "Success"
  status_failure: "Failure"
  violation_separator: ";"
  # Вероятность, записываемая в строку-заглушку при сбое обработки файла.
  fallback_quality_prob: 0.5
  # Как записывать path_to_study: relative (к входной папке) | absolute | name
  path_mode: relative
  csv_encoding: "utf-8"

regions:
  # Официальные строки anatomical_region (сторона бедра НЕ указывается).
  spine: "Поясничный отдел позвоночника"
  hip: "Проксимальный отдел бедра"
  # Регион по умолчанию, если не удалось определить (в исследовании обычно
  # 1 снимок позвоночника и 2 бедра -> априорно бедро вероятнее).
  default_when_unknown: hip
  # Правило по ширине изображения (подтверждено организаторами на Q&A):
  # ширина >= 290 px -> позвоночник (300 px), иначе бедро (280/248 px).
  spine_min_cols: 290
  # Стандартные ширины снимков прибора (GE Lunar Prodigy). При другой ширине
  # область определяется резервным классификатором по содержимому
  # (models/model_region_emb.pkl), а не правилом по ширине.
  standard_cols: [300, 280, 248]

violations:
  # Закрытый список официальных строк. Не переводить, не парафразировать.
  sp_pos: "Некорректная укладка"
  sp_axis: "Не выравнена ось позвоночника"
  sp_art: "Присутствуют посторонние предметы"
  rh_pos: "Некорректная укладка"
  rh_roi: "Некорректная область интереса"
  lh_pos: "Некорректная укладка"
  lh_roi: "Некорректная область интереса"

criteria_by_region:
  spine: [sp_pos, sp_axis, sp_art]
  right_hip: [rh_pos, rh_roi]
  left_hip: [lh_pos, lh_roi]

# Признаки контура A для каждого критерия (должны совпадать с train_stacked.py).
geometry_cols:
  sp_pos: [center_offset_ratio, bone_width_ratio]
  sp_axis: [axis_angle_deg]
  sp_art: [metal_metal_area_mm2, metal_metal_max_intensity_gap]
  rh_pos: [shaft_angle_deg]
  rh_roi: [edge_distance_ratio, bone_area_ratio]
  lh_pos: [shaft_angle_deg]
  lh_roi: [edge_distance_ratio, bone_area_ratio]

stacking:
  # Ранговое усреднение: скор -> перцентиль относительно OOF-распределения
  # (models/oof_stacked_<region>_<crit>.csv, колонки oof_geom / oof_emb),
  # затем взвешенная сумма. Веса должны совпадать с обучением.
  weight_geom: 0.5
  weight_emb: 0.5
  # Вентиль К2: вес контура A (геометрия) ПО КРИТЕРИЮ, score = w*rank_geom + (1-w)*rank_emb.
  # Ключи: sp_pos, sp_axis, sp_art, hip_pos, hip_roi (rh_*/lh_* берут вес hip_pos/hip_roi).
  # Критерий без записи (или null) использует weight_geom/weight_emb выше. Значение здесь
  # ОБЯЗАНО совпадать с тем, что применялось в train_stacked.py (порог подобран на том же стэке).
  # Выбор веса — только nested repeated GroupKFold (tools/nested_gate.py, отчёт docs/NESTED_GATE_REPORT.md).
  # Итог nested 19.09.2026: ни один критерий не прошёл приёмку полностью
  # (sp_axis: +0.069 AUC, 8/10 повторов >= 0.03, но macro-F1 -0.005 -> формально не принят);
  # поэтому таблица пуста, поведение = 0.5/0.5. Включение sp_axis: 1.0 — решение оркестратора,
  # после него обязателен перезапуск train_stacked.py и train_final_models.py.
  weights_by_criterion: {}
  # Как агрегировать скоры критериев в quality_prob (бинарное "есть нарушение"):
  # max | noisy_or. Если есть отдельная модель model_<region>_any_*.pkl — она приоритетнее.
  any_violation_aggregation: max
  # quality_prob = w * any-модель + (1-w) * агрегат по критериям (OOF: смесь лучше каждого по отдельности)
  any_blend_weight_model: 0.5
  # Согласовать quality_prob с quality_class: class=1 -> prob в [0.5,1], class=0 -> prob в [0,0.5).
  # Монотонно внутри класса; OOF ROC-AUC spine 0.735->0.771, hip 0.704->0.777.
  consistent_quality_prob: true

thresholds:
  # null -> взять из metrics_summary.json
  sp_pos: null
  sp_axis: null
  sp_art: null
  rh_pos: null
  rh_roi: null
  lh_pos: null
  lh_roi: null
fallback_threshold: 0.5

# Физические правила контура A (используются, когда .pkl моделей ещё нет
# или они не загрузились). Вероятность = sigmoid((x - center) / scale).
fallback_rules:
  # Центры откалиброваны на data/geometry_features.csv: квантиль (1 - доля позитивов)
  # признака по обучающей выборке (prevalence-порог, без подгонки на редких метках);
  # для ROI бедра — физический порог ТЗ (>= 2 см от края кадра).
  # ВНИМАНИЕ: fallback-правила заметно слабее обученных моделей (см. README, раздел
  # «Ограничения»), они нужны только чтобы инференс давал осмысленный ответ без .pkl.
  sp_axis:   {feature: axis_angle_deg,              center: 3.6,   scale: 1.0,   direction: 1}   # ТЗ: до 5°, измеренный угол систематически ниже экспертного
  sp_art:    {feature: metal_metal_area_mm2,        center: 670.0, scale: 200.0, direction: 1}
  sp_pos:    {feature: center_offset_ratio_abs,     center: 0.074, scale: 0.02,  direction: 1}
  rh_pos:    {feature: shaft_angle_deg,             center: 16.3,  scale: 3.0,   direction: 1}
  lh_pos:    {feature: shaft_angle_deg,             center: 14.7,  scale: 3.0,   direction: 1}
  rh_roi:    {feature: edge_distance_mm,            center: 20.0,  scale: 3.0,   direction: -1}  # ТЗ: >= 2 см от края
  lh_roi:    {feature: edge_distance_mm,            center: 20.0,  scale: 3.0,   direction: -1}
  # Порог принятия решения для fallback-правил (в шкале вероятности)
  decision_threshold: 0.5

validation:
  min_rows: 64
  max_rows: 4096
  min_cols: 64
  max_cols: 4096
  # Доля пикселей кости (после сегментации) в нормальном диапазоне — иначе
  # изображение считается "нестандартным" (пишем предупреждение в лог,
  # результат остаётся консервативным).
  min_bone_fraction: 0.01
  max_bone_fraction: 0.90

pixel_spacing_mm:
  # Lunar Prodigy Advance (подтверждено организаторами). Используется, если
  # тег PixelSpacing / ImagerPixelSpacing отсутствует.
  y: 1.05
  x: 0.6

# Тексты для карточки решения и режима лаборанта (только UI; на 9 колонок CSV и на модель не влияют).
# Экспорт в web/assets/actions.json: python tools/web/build_actions_json.py
# Ключи hip_pos / hip_roi используются для rh_*/lh_*. Официальные строки violations выше не дублируются и не меняются.
actions:
  sp_pos:
    reason: "Нарушение укладки: позвоночник смещён или поясничный отдел не полностью в кадре"
    hint: "Уложить пациента по центру стола, позвоночник по средней линии; проверить, что поясничный отдел целиком в поле сканирования, и повторить сканирование."
  sp_axis:
    reason: "Ось позвоночника наклонена относительно оси стола"
    hint: "Выровнять пациента вдоль продольной оси стола по лазерной метке, без поворота таза и плеч; повторить сканирование."
  sp_art:
    reason: "В кадре плотные посторонние предметы"
    hint: "Убрать из области сканирования металл и плотные предметы: пуговицы, молнии, ремень, содержимое карманов; если предмет убрать нельзя, отметить это в протоколе."
  hip_pos:
    reason: "Бедро повёрнуто или диафиз наклонён"
    hint: "Развернуть стопу внутрь с фиксатором, диафиз бедра параллельно оси стола; малый вертел должен быть почти не виден; повторить сканирование."
  hip_roi:
    reason: "Кость слишком близко к краю кадра или поле сканирования короткое"
    hint: "Сместить поле сканирования: от кости до бокового края не менее 20 мм, в кадр должен войти проксимальный отдел бедра с участком диафиза ниже вертелов; повторить сканирование."
  ok:
    reason: "Отклонений от требований не выявлено"
    hint: "Повторное сканирование не требуется."
  fail:
    reason: "Файл не обработан"
    hint: "Проверить, что файл является DICOM-снимком с денситометра, и передать врачу или инженеру."
  review:
    reason: "Оценка на границе допуска"
    hint: "Показать снимок врачу до решения о повторном сканировании."
# Допуски ТЗ и справочные диапазоны для блока «Измерено против нормы».
# tz — требование ТЗ (норма); ref_q95 считается скриптом build_actions_json.py по размеченным
# нормальным кадрам data/geometry_features.csv (95 % квантиль модуля признака) — только справочно.
measurement_norms:
  axis_angle_deg:         {label: "Угол оси позвоночника", unit: "°", tz_max: 5.0, source: "ТЗ: отклонение оси не более 5°"}
  center_offset_ratio:    {label: "Смещение центра позвоночника", unit: "% ширины кадра", mult: 100, ref: true}
  metal_metal_area_mm2:   {label: "Площадь плотных объектов", unit: "мм²", ref: true}
  abs_shaft_angle_deg:    {label: "Угол диафиза бедра", unit: "°", ref: true}
  edge_distance_mm:       {label: "Расстояние от кости до края кадра", unit: "мм", tz_min: 20.0, source: "ТЗ: не менее 2 см от края"}
  scan_length_mm:         {label: "Длина скана", unit: "мм", ref: true, ref_low: true}
  shaft_len_below_troch_mm: {label: "Диафиз ниже вертелов", unit: "мм", ref: true, ref_low: true}
  lesser_troch_prominence_mm: {label: "Выступ малого вертела", unit: "мм", ref: true}

# Правило порога по критерию (К3). Значения: f1_optimal (F1-оптимум на OOF при >= 15 позитивах, иначе
# prevalence), prevalence (квантиль 1 - доля позитивов), prevalence_x<k> (квантиль 1 - k*доля позитивов).
# Выбрано ТОЛЬКО nested repeated GroupKFold 5x10 (tools/calibration_eval.py --stage nested,
# outputs: outputs/calibration/nested_thr, отчёт docs/METRICS_REPORT.md «Калибровка и зона не уверен») по минимальному
# среднему regret F1(+) по внешним фолдам. Применяется в train_stacked.py; после изменения обязателен
# перезапуск train_stacked.py (пороги в metrics_summary.json).
thresholds_rule:
  default: f1_optimal
  by_criterion:
    sp_pos: prevalence          # 10 позитивов: f1_optimal и так даёт prevalence
    sp_axis: prevalence_x1.4    # regret 0.038 против 0.090 у f1_optimal
    sp_art: prevalence_x1.4     # regret 0.035 против 0.114
    hip_pos: prevalence         # regret 0.050 против 0.082
    hip_roi: prevalence         # regret 0.026 против 0.049

# Зона «не уверен» (К3): строка/критерий помечается needs_review, если |score - threshold| <= margin.
# Запасы считает train_stacked.py (models/calibration.pkl, metrics_summary.json -> uncertainty) так, чтобы доля
# «не уверен» на OOF была <= max_reject_rate и по критерию, и по строкам региона. Значения ниже — копия
# рассчитанных (источник истины: models/calibration.pkl; при null берутся оттуда). Только debug-CSV и API,
# 9 колонок CSV не меняются.
uncertainty:
  enabled: true
  max_reject_rate: 0.05
  quota_step: 0.0025
  margin_by_criterion:
    sp_pos: null
    sp_axis: null
    sp_art: null
    hip_pos: null
    hip_roi: null

# Калибровка (К3). Platt по критерию (p_cal = sigmoid(a*score + b)) — только debug-CSV и API details.
# Калибровка any-модели в quality_prob НЕ принята: cross-fit Brier не улучшается значимо
# (docs/METRICS_REPORT.md), поэтому apply_to_quality_prob: false и в коде не реализовано.
calibration:
  criteria_platt: true
  apply_to_quality_prob: false
